<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Premium Game Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f8f8fa;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #7c5cff;
            margin-bottom: 20px;
        }
        .news-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .news-card h3 {
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .news-card p {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>News</h1>
    <div class="news-card">
        <h3>ပထမဆုံး သတင်း</h3>
        <p>ဒါက စမ်းသပ်သတင်းပါ</p>
    </div>
    <div class="news-card">
        <h3>ဒုတိယ သတင်း</h3>
        <p>ဒါက နောက်ထပ်သတင်းပါ</p>
    </div>
</body>
</html>
